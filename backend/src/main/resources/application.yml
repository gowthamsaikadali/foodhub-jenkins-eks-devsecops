# All secrets come from environment variables. Nothing sensitive is stored in this file.
spring:
  application:
    name: foodhub-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}   # Flyway owns the schema. Set JPA_DDL_AUTO=validate to make Hibernate verify it (see docs/PHASE-04)
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    port: 8081                  # actuator lives on a separate port, never routed by the ingress
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: foodhub-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true   # lets Grafana compute p95/p99 latency

app:
  jwt:
    secret: ${JWT_SECRET}       # at least 32 characters
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_ENABLED:true}
    admin-email: ${SEED_ADMIN_EMAIL:admin@foodhub.local}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    customer-email: ${SEED_CUSTOMER_EMAIL:customer@foodhub.local}
    customer-password: ${SEED_CUSTOMER_PASSWORD:}
  order:
    delivery-fee: 40.00
    free-delivery-above: 500.00
    tax-rate: 0.05

springdoc:
  swagger-ui:
    path: /swagger-ui.html
