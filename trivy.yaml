# Trivy defaults used by every scan in the Jenkins pipelines (trivy --config trivy.yaml ...).
#
# SECURITY POLICY (explicit):
#   * Fail the build on any CRITICAL or HIGH finding.
#   * Vulnerabilities with NO fixed version yet are still listed in the report but do not fail the build,
#     because the team cannot act on them (--ignore-unfixed). They are reviewed when a fix ships.
#   * Exceptions live ONLY in .trivyignore.yaml; each needs a written reason and an expiry date.
severity:
  - CRITICAL
  - HIGH
exit-code: 1
timeout: 10m
format: table
scan:
  scanners:
    - vuln
    - secret
    - misconfig
  skip-dirs:
    - "**/node_modules"
    - "**/target"
    - "**/.terraform"
    - "**/dist"
    - "**/.git"
vulnerability:
  ignore-unfixed: true
ignorefile: .trivyignore.yaml
