apiVersion: v1
kind: Service
metadata:
  name: foodhub-frontend
  namespace: foodhub
  labels:
    app.kubernetes.io/name: foodhub-frontend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foodhub-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
