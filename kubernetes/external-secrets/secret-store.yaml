# Tells External Secrets Operator where to read from: AWS Secrets Manager in ap-south-1.
# No credentials here: the operator pod gets an IAM role through EKS Pod Identity (created by Terraform).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: foodhub
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
