# Builds the Kubernetes Secret "foodhub-backend-secrets" from three Secrets Manager entries.
# Variables in ${...} are filled in by scripts/apply-external-secrets.sh from "terraform output".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foodhub-backend-secrets
  namespace: foodhub
spec:
  refreshInterval: 1h               # re-read AWS every hour, so a rotated password is picked up automatically
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: foodhub-backend-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_URL: "jdbc:mysql://{{ .host }}:{{ .port }}/{{ .dbname }}?sslMode=REQUIRED&serverTimezone=UTC"
        DB_USERNAME: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
        JWT_SECRET: "{{ .jwt }}"
  data:
    - secretKey: username
      remoteRef:
        key: ${DB_MASTER_SECRET_NAME}
        property: username
    - secretKey: password
      remoteRef:
        key: ${DB_MASTER_SECRET_NAME}
        property: password
    - secretKey: host
      remoteRef:
        key: ${DB_CONNECTION_SECRET_NAME}
        property: host
    - secretKey: port
      remoteRef:
        key: ${DB_CONNECTION_SECRET_NAME}
        property: port
    - secretKey: dbname
      remoteRef:
        key: ${DB_CONNECTION_SECRET_NAME}
        property: dbname
    - secretKey: jwt
      remoteRef:
        key: ${JWT_SECRET_NAME}
        property: secret
