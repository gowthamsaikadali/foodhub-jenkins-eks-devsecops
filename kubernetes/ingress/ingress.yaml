# HTTP-only Ingress. Works immediately, no domain needed. Use ingress-https.yaml when you own a domain and an ACM certificate.
# The AWS Load Balancer Controller sees this object and creates an Application Load Balancer in the public subnets.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodhub
  namespace: foodhub
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip          # send traffic straight to pod IPs, skipping NodePorts
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/load-balancer-name: foodhub-alb
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: foodhub-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foodhub-frontend
                port:
                  number: 80
