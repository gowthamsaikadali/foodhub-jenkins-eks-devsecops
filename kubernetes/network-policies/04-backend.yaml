# Backend pods:
#   IN : the load balancer and the frontend pods on 8080, Prometheus (monitoring namespace) on 8081
#   OUT: MySQL on the private database subnets (10.0.20.0/23 covers 10.0.20.0/24 and 10.0.21.0/24), plus DNS (separate policy)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: foodhub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: foodhub-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: foodhub-frontend
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 8081 }
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.20.0/23
      ports:
        - { protocol: TCP, port: 3306 }
