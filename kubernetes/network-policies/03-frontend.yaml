# Frontend pods: accept traffic only from the load balancer (which lives inside the VPC, 10.0.0.0/16)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: foodhub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: foodhub-frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:                               # only for the optional /api proxy inside Nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: foodhub-backend
      ports:
        - { protocol: TCP, port: 8080 }
