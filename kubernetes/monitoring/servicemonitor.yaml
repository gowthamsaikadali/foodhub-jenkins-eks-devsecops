# Tells Prometheus (kube-prometheus-stack) to scrape the backend's /actuator/prometheus every 30 seconds.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: foodhub-backend
  namespace: foodhub
  labels:
    release: kube-prometheus-stack     # must match the Helm release name, otherwise Prometheus ignores this object
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: foodhub-backend
  namespaceSelector:
    matchNames: [foodhub]
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 30s
