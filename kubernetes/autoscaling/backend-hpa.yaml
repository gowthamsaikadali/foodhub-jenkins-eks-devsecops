# Needs metrics-server (installed by scripts/bootstrap-cluster.sh)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: foodhub-backend
  namespace: foodhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: foodhub-backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70      # percent of the CPU *request* (250m)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # wait 5 minutes of low load before removing pods
