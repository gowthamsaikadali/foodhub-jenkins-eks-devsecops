# Non-secret settings. Secrets (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET) come from the "foodhub-backend-secrets" Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: foodhub-backend-config
  namespace: foodhub
data:
  SPRING_PROFILES_ACTIVE: "prod"
  JWT_EXPIRATION_MINUTES: "120"
  # Browser requests come from the same origin through the ALB, so CORS is not needed in the cluster.
  # Put your real domain here if the frontend is ever served from a different origin.
  CORS_ALLOWED_ORIGINS: "https://foodhub.example.com"
  # No demo accounts in the cluster. Create the first admin with scripts/create-admin.sh
  SEED_ENABLED: "false"
  JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
