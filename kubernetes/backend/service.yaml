apiVersion: v1
kind: Service
metadata:
  name: foodhub-backend
  namespace: foodhub
  labels:
    app.kubernetes.io/name: foodhub-backend
  annotations:
    # The ALB health-checks each target through this public, read-only endpoint
    alb.ingress.kubernetes.io/healthcheck-path: /api/restaurants
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foodhub-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics          # scraped by Prometheus; the Ingress never routes to it
      port: 8081
      targetPort: metrics
