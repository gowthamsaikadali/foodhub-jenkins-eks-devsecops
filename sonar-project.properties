# SonarQube analysis settings for the whole repository (Java backend + React frontend).
# The server URL and token are injected by Jenkins (withSonarQubeEnv) and are NOT stored here.
sonar.projectKey=foodhub
sonar.projectName=FoodHub
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=**/*Test.java,**/*.test.js,**/*.test.jsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.test.js,**/*.test.jsx,frontend/src/styles/**

# Java needs the compiled classes (Jenkins builds first, then analyses)
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/entity/**,**/dto/**,**/config/**,**/FoodHubApplication.java,frontend/src/**
