# Local development stack: MySQL + Spring Boot + React/Nginx.
# Usage:  cp .env.example .env   (edit passwords)   then   docker compose up --build
name: foodhub

services:
  mysql:
    image: mysql:8.0
    container_name: foodhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: foodhub
      MYSQL_USER: ${DB_USERNAME:-foodhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql                      # named volume: data survives container removal
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/foodhub.cnf:ro
    ports:
      - "127.0.0.1:3307:3306"                          # host 3307 -> container 3306, localhost only
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [foodhub-net]

  backend:
    build: ./backend
    image: foodhub-backend:local
    container_name: foodhub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/foodhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-foodhub}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ chars) in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      SEED_ENABLED: "true"
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"                          # API (for curl / Swagger)
      - "127.0.0.1:8081:8081"                          # actuator health + metrics
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [foodhub-net]

  frontend:
    build: ./frontend
    image: foodhub-frontend:local
    container_name: foodhub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:8080"                                    # open http://localhost:3000
    networks: [foodhub-net]

volumes:
  mysql_data:

networks:
  foodhub-net:
    driver: bridge
