# Helm values for the kube-prometheus-stack chart (Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics).
# DEV settings: no persistent disks (data is lost if the pod restarts) to keep cost and complexity low.
# PROD: add storage (EBS CSI driver + volumeClaimTemplate) and longer retention.

fullnameOverride: kube-prometheus-stack

defaultRules:
  create: true
  rules:
    etcd: false                  # EKS hides the control plane, so these would only create false alerts
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeProxy: false

# EKS does not expose these control-plane components to Prometheus
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  service:
    type: ClusterIP              # never exposed publicly
  prometheusSpec:
    retention: 3d
    # Pick up ServiceMonitor / PrometheusRule objects from ANY namespace (our own live in "foodhub"), not only Helm-installed ones
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 700Mi }
      limits: { memory: 1200Mi }
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 128Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']     # Watchdog fires forever on purpose to prove the pipeline works
        # To receive email/Slack, add a receiver below and route severity=~"critical|warning" to it.
        # See monitoring/alertmanager-email-example.yaml
    receivers:
      - name: "null"

grafana:
  enabled: true
  service:
    type: ClusterIP              # reach it with: kubectl port-forward (see docs/PHASE-14)
  admin:
    existingSecret: grafana-admin          # created by scripts/install-monitoring.sh with a random password
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: Asia/Kolkata
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard             # any ConfigMap with this label becomes a dashboard automatically
      labelValue: "1"
      searchNamespace: ALL
  persistence:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 150Mi }
    limits: { memory: 300Mi }
  grafana.ini:
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false

nodeExporter:
  enabled: true

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 100Mi }
    limits: { memory: 200Mi }
