# OPTIONAL overlay to get alert emails. Use together with the main values file:
#   helm upgrade kube-prometheus-stack ... -f monitoring/kube-prometheus-stack-values.yaml -f monitoring/alertmanager-email-example.yaml
# 1. Create the SMTP password as a Kubernetes secret (never put it in this file):
#      kubectl -n monitoring create secret generic alertmanager-smtp --from-literal=password='YOUR_APP_PASSWORD'
# 2. Replace the placeholders below (for Gmail: smtp.gmail.com:587 and an "App password").
alertmanager:
  alertmanagerSpec:
    secrets: [alertmanager-smtp]      # mounted at /etc/alertmanager/secrets/alertmanager-smtp/
  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: your-address@example.com
      smtp_auth_username: your-address@example.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        - receiver: email-oncall
          matchers: ['severity =~ "critical|warning"']
    receivers:
      - name: "null"
      - name: email-oncall
        email_configs:
          - to: your-address@example.com
            send_resolved: true
